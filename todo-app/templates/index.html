<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 40px 15px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        form {
            display: flex;
            gap: 8px;
        }
        
        input {
            flex: 1;
            min-width: 0;
            padding: 10px;
        }
        
        button {
            padding: 10px;
            border: none;
            color: white;
            background: #2563eb;
            cursor: pointer;
            border-radius: 4px;
        }
        
        ul {
            padding: 0;
            list-style: none;
        }
        
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .delete {
            background: #dc2626;
        }
        
        .empty {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form action="{{ url_for('add_task') }}" method="POST">
            <input type="text" name="task" placeholder="Enter a new task" required>
            <button type="submit">Add Task</button>
        </form>

        <h3>My Tasks</h3>

        {% if tasks %}
        <ul>
            {% for task in tasks %}
            <li>
                <span>{{ task.name }}</span>

                <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST">
                    <button class="delete" type="submit">
                                Delete
                            </button>
                </form>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="empty">No tasks added yet.</p>
        {% endif %}
    </div>
</body>

</html>
